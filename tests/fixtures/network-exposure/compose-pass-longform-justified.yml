version: "3.9"
services:
  traefik:
    image: traefik
    x-exposure-justification: "public HTTPS edge behind Cloudflare WAF + mesh-host pinning"
    x-exposure-expires: "2026-08-04"
    ports:
      - mode: ingress
        # RFC 5737 TEST-NET-1 (192.0.2.0/24) — reserved for documentation and
        # never globally routable, so this fixture cannot name a real host.
        # personal-id-gate.sh exempts this block by design; the RFC 2544
        # benchmark range (198.18.0.0/15) is NOT exempt, so do not use it here.
        host_ip: "192.0.2.10"
        target: 80
        published: "80"
        protocol: tcp
