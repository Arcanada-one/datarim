# Datarim configuration template.
#
# Locations:
#   ./datarim/config.yaml           - shared project defaults
#   ./datarim/config.local.yaml     - private project overrides; keep ignored
#   $XDG_CONFIG_HOME/datarim/config.yaml (fallback ~/.config/datarim/config.yaml)
#                                 - personal user preferences
# Project installation excludes datarim/ from git; sharing config.yaml requires
# a reviewed, explicit tracking choice. Do not share private overrides/task data.
# Language and peer-review provider have separate resolution rules.
# Reference: documentation/reference/language-preferences.md

language:
  # Independent safe language tags; English is the fallback for both.
  # Replies: local project > user > shared project > en.
  # Artifacts: local project > shared project/legacy AGENTS directive > user > en.
  # Explicit task/CLI overrides and delegated environment come first.
  # Conflicting YAML and legacy Artifact language directives are errors.
  replies: en
  artifacts: en

# Peer review: project config wins over user config.
# Reference: skills/self-verification/SKILL.md - Peer Review Provider Resolution
peer_review:
  # Provider for Layer 2 peer-review in /dr-verify.
  #
  # Whitelist (enforced by ${DATARIM_RUNTIME:?}/dev-tools/resolve-peer-provider.sh):
  #   sonnet      — cross_claude_family mode (via Claude Code subagent dispatch)
  #   haiku       — cross_claude_family mode (200K context — verify PRD/plan size)
  #   none        — disables Layer 2 entirely (Layer 1 floor + Layer 3 only)
  #
  # External coworker providers (deepseek/moonshot/openrouter/groq) are forbidden
  # here: adversarial review, AC verification, and hidden-gap discovery stay on
  # the selected agent runtime, not on coworker.
  #
  # Unknown values → resolve-peer-provider.sh exits 1 (supply-chain mitigation).
  provider: sonnet

  # Model used when chain reaches cross-Claude-family subagent fallback.
  # Triggered when no provider is configured anywhere in the chain.
  #
  # Whitelist:
  #   sonnet  — default; 1M context; safe for large PRDs/plans
  #   haiku   — cheaper but 200K context; truncation risk on artifacts >200K tokens
  fallback_model: sonnet
