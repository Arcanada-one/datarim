schema_version: 1
contract_id: datarim-frontend-design-decision-contract
design_owner: designer
acceptance_owner: operator
managed_kinds:
  - Role
  - Skill
  - Blueprint
  - Constraint
  - SuccessCriterion
  - Policy
  - CapabilityDescription
activation:
  requires_rendered_customer_surface: true
  backend_only_invokes: false
workflow:
  ordered_stages:
    - reuse_inventory
    - external_research
    - seven_kind_gap_analysis
    - reusable_artifact_creation_and_validation
    - knowledge_contract_issuance
  implementation_requires_knowledge_contract_state: MET
policies:
  preliminary_taste_approval_required: false
  existing_design_system_strategy: reuse_and_extend
  accessibility_conflict_strategy: accessible_alternative
  accessibility_floor: WCAG-2.2-AA
  ru_overflow_strategy: redesign_layout
  shrink_critical_text: false
  post_hoc_binding_allowed: false
  unbound_delivery_allowed: false
  replacement_default: false
  emits_product_code: false
evidence_matrix:
  locales: [RU, EN]
  viewports: [desktop, tablet, mobile]
  themes: [light, dark]
  expected_cells_per_surface: 12
