# dr-orchestrate user config template
# Copy to user-config.yaml, chmod 600, then edit.
# user-config.yaml is gitignored — see code/datarim/.gitignore.

key_injection: false   # MUST be set to true to allow send-keys; default fail-closed.
session_name: datarim
audit_dir: ~/.local/share/datarim-orchestrate
state_dir: ~/.local/share/datarim-orchestrate/state

# Context-window self-clearing. Both this section and key_injection
# must be explicitly enabled. Same-UID runtime processes are one trusted origin
# domain; lifecycle HMAC tags provide integrity/correlation, not provenance.
context_window:
  enabled: false
  trust_same_uid_runtime: false
  policy_label: ""
  selective_percent: 75
  full_clear_percent: 90

# Subagent inference layer. Effective autonomy is resolved per-space at
# runtime via action_gate.sh + space.yml § autonomy.policy.
#
# The resolver chain, its budget, the confidence threshold and the escalation
# backend are NOT read from this file. Set them in the environment:
#   DR_ORCH_SUBAGENT_CHAIN        default "claude codex cursor"
#   DR_ORCH_RESOLVER_TIMEOUT_S    default 15 (per backend)
#   DR_ORCH_CONFIDENCE_THRESHOLD  default 0.80
#   DR_ORCH_ESCALATION_BACKEND    mock | dev-bot (default mock; dev-bot is a stub)
#   DR_ORCH_ESCALATION_MOCK_LOG   default ~/.local/share/dr-orchestrate/escalation.jsonl

# Bot-Interaction Interface dispatcher (Datarim v2.5.0+).
# Routes orchestrator IO either through terminal (current behaviour) or
# through a bot proxy via the plugin v0.3.0+ interface.
bot_interaction:
  provider: terminal              # terminal | agent0017
  endpoint: ""                    # required iff provider=agent0017 (e.g. http://localhost:3010/prompts)
  shared_secret_ref: ""           # required iff provider=agent0017 (vault:secret/datarim/orchestrator/hmac_secret or env:NAME)
  outbound_backend: callback      # callback | redis (relevant when provider=agent0017)
  redis_url: ""                   # required iff outbound_backend=redis (e.g. redis://redis-host:6379/0)
  inbound_bind: 127.0.0.1:8090    # advisory — adnanh/webhook bind from CLI flag
  bearer_secret_ref: ""           # vault:secret/datarim/orchestrator/bearer or env:NAME
