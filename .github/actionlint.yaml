# actionlint configuration.
#
# Custom labels carried by this organisation's self-hosted runners. actionlint
# knows only GitHub's hosted labels, so without this list it reports a valid
# self-hosted label as unknown and the actionlint gate fails.
#
# `dev` selects arcana-devs{,-2,-3}. It exists because [self-hosted, linux, X64]
# alone is every self-hosted machine in the org, web and production hosts
# included, and a job that landed on arcana-www could not create a Python venv
# there -- see the comment on jev-and-project-runtime in bats.yml.
self-hosted-runner:
  labels:
    - dev
    - arcana-devs
    - arcana-www
    - arcana-prod
    - arcana-prod-ci
    - arcana-ai
    - ci-general
    - docker
    - sites
