name: scorecard

# OpenSSF Scorecard: weekly score + on-demand runs publish to the
# OpenSSF dashboard. Push runs still upload SARIF, but skip dashboard
# publishing so external Fulcio/OIDC publish outages do not block releases.

on:
  branch_protection_rule:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: openssf-scorecard
    runs-on: ubuntu-latest
    permissions:
      # Required for publish_results to OpenSSF dashboard.
      id-token: write
      # Required to upload SARIF to code-scanning.
      security-events: write
      # Read-only repo access.
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.event_name != 'push' }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
