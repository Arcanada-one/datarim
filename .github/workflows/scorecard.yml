name: scorecard

# OpenSSF Scorecard: weekly score + on-demand runs publish to the
# OpenSSF dashboard. Push runs still upload SARIF, but skip dashboard
# publishing so external Fulcio/OIDC publish outages do not block releases.

on:
  branch_protection_rule:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: openssf-scorecard
    runs-on: ubuntu-latest
    permissions:
      # Required for publish_results to OpenSSF dashboard.
      id-token: write
      # Required to upload SARIF to code-scanning.
      security-events: write
      # Read-only repo access.
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.event_name != 'push' }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
