name: TALO-0001 projection contract

on:
  pull_request:
    paths:
      - 'datarim/insights/INSIGHTS-TALO-0001.md'
      - 'datarim/insights/TALO-0001-research-authority-audit.json'
      - 'dev-tools/check-research-authority-audit.py'
      - 'dev-tools/check-talo-0001-research-projection.py'

permissions:
  contents: read

jobs:
  projection:
    name: talo-0001-projection-contract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate public projection only (no raw-evidence claim)
        run: python3 dev-tools/check-talo-0001-research-projection.py
