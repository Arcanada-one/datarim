name: release

# Datarim release workflow (TUNE-0050).
# Dispatches trusted workflow code from protected main for one signed tag. Builds source via `git archive`,
# generates CycloneDX SBOM via syft, signs both with cosign keyless OIDC,
# attests build provenance (SLSA L2) via actions/attest-build-provenance,
# publishes everything to GitHub Releases.
#
# Approach: Hybrid C — cosign sign-blob (portable verification) + GitHub
# native attestations (SLSA L2). End-user verify recipe lives in
# documentation/how-to/release-verification.md.
#
# Tools install pattern (mirrors security.yml):
#   - cosign + syft → standalone binaries, sha256-verified.
#   - actions/checkout, actions/attest-build-provenance, softprops/action-gh-release
#     → SHA-pinned to commit.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Signed annotated SemVer tag to publish
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  COSIGN_VERSION: v3.0.6
  COSIGN_SHA256: c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74
  SYFT_VERSION: v1.43.0
  SYFT_SHA256: 7b98251d2d08926bb5d4639b56b1f0996a58ef6667c5830e3fe3cd3ad5f4214a

jobs:
  # Major-gate backstop (TUNE-0351). Reads the bump level the agent stamped into
  # the annotated tag, re-classifies in CI (authoritative API-diff surface), and
  # takes max(stamped, ci) so the GitHub environment gate does not trust the
  # agent's stamp. The release job selects its environment from this output.
  classify:
    name: classify-bump
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bump_level: ${{ steps.read.outputs.bump_level }}
      release_sha: ${{ steps.read.outputs.release_sha }}
      release_tag_object: ${{ steps.read.outputs.release_tag_object }}
      workflow_sha: ${{ steps.read.outputs.workflow_sha }}
      release_tag: ${{ steps.read.outputs.release_tag }}
      root_release: ${{ steps.read.outputs.root_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0           # full history — the CI re-classify walks a commit range
          persist-credentials: false
      - name: Authenticate signed tag on protected main and classify bump
        id: read
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_REF: ${{ github.ref }}
        run: bash .github/scripts/workflow/release-classify-01-authenticate-signed-tag-on-protected-main-and-cl.sh
      # Advisory drift check on the declared release environment policy
      # (.github/environments-policy.yml). Fail-soft by design: the script
      # exits 0 on missing token/API access and on drift (advisory), so this
      # step cannot block a release — it validates the declaration file and
      # surfaces missing main/v* deployment policies BEFORE the release job
      # hits the environment gate and dies with an opaque rejection.
      - name: Release environment policy drift check (advisory)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/workflow/release-check-env-policy.sh

  release:
    name: build-sign-attest-publish
    needs: [classify]
    runs-on: ubuntu-latest
    # Conditional environment (TUNE-0351): a major bump routes to release-manual
    # (required reviewer); patch/minor flows through release-auto (no reviewer).
    #
    # REQUIRED ENVIRONMENT POLICY: both `release-auto` and `release-manual`
    # MUST allow deployments from the `main` branch used by workflow_dispatch.
    # The retained `v*` tag policy keeps the provisioner compatible with
    # tag-triggered consumers. The policy is declared in version control at
    # `.github/environments-policy.yml` and drift-checked in the classify job.
    # Apply it with `dev-tools/provision-release-env.sh --repo <owner/name>
    # --env <name> --tag-policy 'v*' --branch-policy main --apply`
    # (idempotent; add `--reviewers User:<id>` for release-manual).
    environment:
      name: ${{ (needs.classify.outputs.bump_level == 'major' && 'release-manual') || 'release-auto' }}
    permissions:
      contents: write       # required to create the GitHub Release
      id-token: write       # required for cosign keyless OIDC + attestations
      attestations: write   # required for actions/attest-build-provenance
    steps:
      # The checkout comes first: every helper below runs a script from this
      # repository, so the working tree must exist before the first one. The
      # tag-format helper was extracted from an inline step after this job was
      # last green, and the stale order made it exit 127 (no such file).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.classify.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag format
        env:
          RELEASE_TAG: ${{ needs.classify.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.classify.outputs.release_sha }}
        run: bash .github/scripts/workflow/release-release-01-validate-tag-format.sh

      - name: Confirm release tree identity
        run: bash .github/scripts/workflow/release-release-02-confirm-release-tree-identity.sh
      - name: Load verifier from the classified protected-main commit
        env:
          WORKFLOW_SHA: ${{ needs.classify.outputs.workflow_sha }}
        run: bash .github/scripts/workflow/release-release-03-load-verifier-from-the-classified-protected-main.sh
      - name: Recheck classified signed tag identity
        env:
          RELEASE_TAG: ${{ needs.classify.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.classify.outputs.release_sha }}
          RELEASE_TAG_OBJECT: ${{ needs.classify.outputs.release_tag_object }}
        run: bash .github/scripts/workflow/release-release-04-recheck-classified-signed-tag-identity.sh
      - name: Install cosign (verified binary)
        run: bash .github/scripts/workflow/release-release-05-install-cosign-verified-binary.sh
      - name: Install syft (verified binary)
        run: bash .github/scripts/workflow/release-release-06-install-syft-verified-binary.sh
      - name: Build source tarball (deterministic)
        run: bash .github/scripts/workflow/release-release-07-build-source-tarball-deterministic.sh
      - name: Build portable reporting archives
        run: bash .github/scripts/workflow/release-release-08-build-portable-reporting-archives.sh
      - name: Generate SBOM (CycloneDX)
        run: bash .github/scripts/workflow/release-release-09-generate-sbom-cyclonedx.sh
      - name: Cosign sign-blob (tarball + SBOM)
        run: bash .github/scripts/workflow/release-release-10-cosign-sign-blob-tarball-sbom.sh
      # Re-scan the exact assets built by this job, including decoded archive
      # members and signing bundles, before any Release asset is published.
      - name: Release asset privacy gate
        env:
          PERSONAL_ID_OVERLAY_B64: ${{ secrets.PERSONAL_ID_OVERLAY_B64 }}
          DATARIM_PERSONAL_ID_REVISION_ID: ${{ secrets.PERSONAL_ID_OVERLAY_REVISION }}
          DATARIM_PERSONAL_ID_OVERLAY_SHA256: ${{ secrets.PERSONAL_ID_OVERLAY_SHA256 }}
        run: bash .github/scripts/workflow/release-release-11-release-asset-privacy-gate.sh
      - name: Attest build provenance (SLSA L2)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ env.TARBALL }}
            human-outcome-reporting.zip
            datarim-human-reporting-integration.zip

      - name: Recheck classified tag immediately before publication
        env:
          RELEASE_TAG_OBJECT: ${{ needs.classify.outputs.release_tag_object }}
        run: bash .github/scripts/workflow/release-release-12-recheck-classified-tag-immediately-before-public.sh
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          prerelease: ${{ env.IS_PRERELEASE }}
          # Retired baseline tags cannot support a bootstrap compare link.
          generate_release_notes: ${{ needs.classify.outputs.root_release != 'true' }}
          fail_on_unmatched_files: true
          body: |
            Verify this release before installing — see
            [documentation/how-to/release-verification.md](https://github.com/Arcanada-one/datarim/blob/${{ env.TAG }}/documentation/how-to/release-verification.md).

            Changes: [CHANGELOG.md](https://github.com/Arcanada-one/datarim/blob/${{ env.TAG }}/CHANGELOG.md).
          files: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256
            ${{ env.TARBALL }}.cosign.bundle
            ${{ env.SBOM }}
            ${{ env.SBOM }}.cosign.bundle
            human-outcome-reporting.zip
            human-outcome-reporting.zip.sha256
            human-outcome-reporting.zip.cosign.bundle
            datarim-human-reporting-integration.zip
            datarim-human-reporting-integration.zip.sha256
            datarim-human-reporting-integration.zip.cosign.bundle
