# Personal-identifier hygiene gate.
# Scans the shipped framework surface for personal names, handles, hostnames,
# numeric GIDs, and Vault paths that must not appear in public artefacts.
# See Security Mandate § S3 (personal data) in CLAUDE.md for the canonical
# policy text; the machine-readable contract surface lives in
# dev-tools/personal-id-forbidden.regex + scripts/personal-id-gate.sh.

name: personal-id-lint

# The two `paths:` lists below MUST stay a superset of DEFAULT_PATHS in
# scripts/personal-id-gate.sh. They previously mirrored an older, narrower
# DEFAULT_PATHS and were never updated when the gate's scan surface widened, so
# CI was blind to exactly the half of the tree (plugins/, config/, tests/,
# .github/, root installers) that the gate had started scanning locally. A
# passing CI run was then an artefact of the filter, not evidence of a clean
# tree.
#
# Drift between the two is now caught by tests/personal-id-lint-scope.bats.
#
# The list is duplicated rather than shared via a YAML anchor: GitHub Actions
# does not support anchors/aliases in workflow files. The regression test
# checks BOTH copies.
on:
  push:
    branches: [ main ]
    paths:
      - 'cli/**'
      - 'skills/**'
      - 'agents/**'
      - 'commands/**'
      - 'templates/**'
      - 'scripts/**'
      - 'dev-tools/**'
      - 'plugins/**'
      - 'config/**'
      - 'tests/**'
      - '.github/**'
      - 'docs/**'
      - 'documentation/**'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'README.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'install.sh'
      - 'update.sh'
      - 'validate.sh'
  pull_request:
    branches: [ main ]
    paths:
      - 'cli/**'
      - 'skills/**'
      - 'agents/**'
      - 'commands/**'
      - 'templates/**'
      - 'scripts/**'
      - 'dev-tools/**'
      - 'plugins/**'
      - 'config/**'
      - 'tests/**'
      - '.github/**'
      - 'docs/**'
      - 'documentation/**'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'README.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'install.sh'
      - 'update.sh'
      - 'validate.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  personal-id-lint:
    name: personal-id-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run personal-id gate
        run: |
          set -euo pipefail
          chmod +x scripts/personal-id-gate.sh
          bash scripts/personal-id-gate.sh --report
