name: bats

# Repo-wide bats regression gate.
#
# DISCOVERY, NOT ENUMERATION
# --------------------------
# This workflow deliberately does NOT name suites. It shells out to
# `tests/run-bats-discovery.sh`, which globs every *.bats file in the repo and
# subtracts the exclusion registry (`tests/bats-exclusions.yml`).
#
# The previous design named suites explicitly and ran `bats tests/`, which is
# NOT recursive — so `tests/security/` and `tests/install-matrix/` were invisible
# to it, and the whole of `cli/tests/`, `plugins/dr-orchestrate/tests/` and most
# of `dev-tools/tests/` were run by no job at all. Enumeration fails open: a
# suite added tomorrow is simply never listed and nothing complains. Discovery
# fails closed: a new suite runs the moment it lands, and skipping one requires
# a dated, reasoned entry in the registry.
#
# No `paths:` filter on purpose — a release PR that touches only VERSION and
# CHANGELOG.md must still run the full regression gate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry:
    name: exclusion registry + inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the bats exclusion registry
        # Fail-closed: a stale entry (suite renamed or deleted) would silently
        # keep a live suite dark under a path nobody checks.
        run: bash tests/run-bats-discovery.sh --check-registry

      - name: Publish suite inventory
        run: |
          set -euo pipefail
          total=$(find . -type f -name '*.bats' ! -path './.git/*' | wc -l)
          running=$(bash tests/run-bats-discovery.sh --list | wc -l)
          {
            echo "### bats inventory"
            echo
            echo "| metric | count |"
            echo "| --- | --- |"
            echo "| suites on disk | ${total} |"
            echo "| suites executed | ${running} |"
            echo "| excluded (registry) | $(( total - running )) |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "on disk: ${total}, executed: ${running}"

  suites:
    name: shard ${{ matrix.shard }}/8
    needs: registry
    runs-on: ubuntu-latest
    strategy:
      # Never cancel siblings: one red shard must not hide failures in the
      # other seven. The point of this job is a complete picture.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Suites that inspect git topology (archive-auto-commit,
          # session-handoff-squash-collision, framework-version-accountability)
          # need real history, not a depth-1 cone.
          fetch-depth: 0

      - name: Install pinned toolchain
        run: bash tests/ci-install-bats-deps.sh

      - name: Run shard ${{ matrix.shard }} of 8
        run: bash tests/run-bats-discovery.sh --shard ${{ matrix.shard }}/8
