name: bats

# Repo-wide bats regression gate.
#
# DISCOVERY, NOT ENUMERATION
# --------------------------
# This workflow deliberately does NOT name suites. It shells out to
# `tests/run-bats-discovery.sh`, which globs every *.bats file in the repo and
# subtracts the exclusion registry (`tests/bats-exclusions.yml`).
#
# The previous design named suites explicitly and ran `bats tests/`, which is
# NOT recursive — so `tests/security/` and `tests/install-matrix/` were invisible
# to it, and the whole of `cli/tests/`, `plugins/dr-orchestrate/tests/` and most
# of `dev-tools/tests/` were run by no job at all. Enumeration fails open: a
# suite added tomorrow is simply never listed and nothing complains. Discovery
# fails closed: a new suite runs the moment it lands, and skipping one requires
# a dated, reasoned entry in the registry.
#
# No `paths:` filter on purpose — a release PR that touches only VERSION and
# CHANGELOG.md must still run the full regression gate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_hosted_macos:
        description: "Run macOS gates only after hosted-runner availability is qualified"
        type: boolean
        default: false

permissions:
  contents: read

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: bats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jev-and-project-runtime:
    name: Jev and project runtime contracts
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, X64, ci-general]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact triggering head
        run: bash .github/scripts/workflow/bats-jev-and-project-runtime-01-assert-exact-triggering-head.sh

      # `runs-on: [self-hosted, linux, X64]` matches nearly every runner in the
      # fleet and they are NOT interchangeable -- the same point INFRA-0365
      # measured for the security audit. Here it showed up as the job landing on
      # a web-serving runner host, where `/usr/bin/python3 -m venv` cannot build an
      # interpreter: Python 3.10 there ships no ensurepip, so the step died
      # before a single contract ran. Measured as ci-runner, the account that
      # runs the job: venv succeeds on the dev host (3.12), fails on the web host.
      #
      # Provisioned rather than pinned, following the remedy INFRA-0365 already
      # settled on: pinning to whichever hosts happen to be equipped today
      # shrinks the eligible pool and worsens the slot contention in INFRA-0364.
      # setup-python brings a complete interpreter into the tool cache, so the
      # job stops depending on what a given host was built with.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pinned test dependencies
        run: bash .github/scripts/workflow/bats-jev-and-project-runtime-02-install-pinned-test-dependencies.sh
      - name: Verify Jev source manifest
        run: bash .github/scripts/workflow/bats-jev-and-project-runtime-03-verify-jev-source-manifest.sh
      - name: Run offline engine and lifecycle contracts
        run: bash .github/scripts/workflow/bats-jev-and-project-runtime-04-run-offline-engine-and-lifecycle-contracts.sh
  registry:
    name: exclusion registry + inventory
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      linux_matrix: ${{ steps.customer_delivery_matrix.outputs.linux }}
      macos_matrix: ${{ steps.customer_delivery_matrix.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact triggering head
        run: bash .github/scripts/workflow/bats-registry-01-assert-exact-triggering-head.sh

      - name: Validate the bats exclusion registry
        # Fail-closed: a stale entry (suite renamed or deleted) would silently
        # keep a live suite dark under a path nobody checks.
        run: bash tests/run-bats-discovery.sh --check-registry

      - name: Validate exact customer-delivery shard coverage
        run: bash .github/scripts/workflow/bats-registry-02-validate-exact-customer-delivery-shard-coverage.sh

      - name: Generate customer-delivery matrices from the canonical registry
        id: customer_delivery_matrix
        run: bash .github/scripts/workflow/bats-registry-03-generate-customer-delivery-matrices-from-the-can.sh
      - name: Publish suite inventory
        run: bash .github/scripts/workflow/bats-registry-04-publish-suite-inventory.sh
  suites:
    name: shard ${{ matrix.shard }}/8
    needs: registry
    runs-on: ubuntu-latest
    strategy:
      # Never cancel siblings: one red shard must not hide failures in the
      # other seven. The point of this job is a complete picture.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Suites that inspect git topology (archive-auto-commit,
          # session-handoff-squash-collision, framework-version-accountability)
          # need real history, not a depth-1 cone.
          fetch-depth: 0

      - name: Install pinned toolchain
        run: bash .github/scripts/workflow/bats-suites-01-install-pinned-toolchain.sh
      - name: Run shard ${{ matrix.shard }} of 8
        env:
          BATS_SHARD: ${{ matrix.shard }}
        run: bash .github/scripts/workflow/bats-suites-02-run-shard-matrix-shard-of-8.sh

  customer-delivery-linux:
    name: customer delivery ${{ matrix.suite }} ${{ matrix.shard }} (Linux)
    needs: registry
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.registry.outputs.linux_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact triggering head
        run: bash .github/scripts/workflow/bats-customer-delivery-linux-01-assert-exact-triggering-head.sh

      - name: Create trusted absolute Python environment
        run: bash .github/scripts/workflow/bats-customer-delivery-linux-02-create-trusted-absolute-python-environment.sh
      - name: Verify trusted Python launcher runtime and dependencies
        run: bash tests/check-customer-delivery-python-runtime.sh "$RUNNER_TEMP/customer-delivery-venv/bin/python"

      - name: Run bounded exact shard
        timeout-minutes: 2
        env:
          SUITE: ${{ matrix.suite }}
          SHARD: ${{ matrix.shard }}
        run: bash .github/scripts/workflow/bats-customer-delivery-linux-03-run-bounded-exact-shard.sh
      - name: Upload exact shard result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: customer-delivery-linux-${{ strategy.job-index }}
          path: ${{ runner.temp }}/customer-delivery-result/*.json
          if-no-files-found: error
          retention-days: 1

  macos-portability:
    if: github.event_name == 'workflow_dispatch' && inputs.run_hosted_macos
    name: portability (macOS / BSD userland)
    needs: registry
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # WHY THIS JOB EXISTS (TUNE-0562)
      #
      # The other 40 jobs all run ubuntu-latest, so GNU-vs-BSD divergence is
      # invisible to CI. Two real defects in one week came from exactly that:
      #
      #   * `head -c 0` is GNU-only. BSD/macOS rejects it with "illegal byte
      #     count". In snapshot-writer.sh the byte budget is legitimately clamped
      #     to 0 by an oversized --options-file, so under `set -e` the writer
      #     ABORTED BEFORE its size-cap check could fail closed — a hard guard
      #     silently became a pass. Shipped broken; fixed in v2.60.1.
      #   * The mirror case: `dr-backlog add`'s flock bug is UNREACHABLE on macOS
      #     (no flock(1), so the python shim runs). Mutation-testing it on Linux
      #     gives 3 failures and on macOS gives 0 — a green Mac run proves nothing
      #     there, just as a green Linux run proved nothing about the cap guard.
      #
      # Neither platform can vouch for the other. This job is deliberately
      # SCOPED, not a second full suite: it runs the suites covering code that
      # uses portability-sensitive constructs (head -c, sed -i, flock,
      # readlink -f, grep -P, find -newermt), which is where the divergence
      # actually bites. Full parity on paid macOS minutes buys little beyond it.
      - name: Install bats and A2 platform dependencies
        run: bash .github/scripts/workflow/install-bats-brew.sh bats-core yq openssl@3

      - name: Create pinned portability Python environment
        run: bash .github/scripts/workflow/bats-macos-portability-01-create-pinned-portability-python-environment.sh
      - name: Verify portability Python through trusted bootstrap
        run: bash tests/check-customer-delivery-python-runtime.sh "$RUNNER_TEMP/portability-venv/bin/python"

      - name: Confirm this really is a BSD userland
        # Fail loudly if the runner image ever ships GNU coreutils first on PATH:
        # the job would then pass while testing nothing it was created to test.
        run: bash .github/scripts/workflow/bats-macos-portability-02-confirm-this-really-is-a-bsd-userland.sh
      - name: Run portability-sensitive suites
        run: bash .github/scripts/workflow/bats-macos-portability-03-run-portability-sensitive-suites.sh
      - name: Run CI dependency and portability contracts
        run: bats tests/bats-discovery-coverage.bats

  customer-delivery-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.run_hosted_macos
    name: customer delivery ${{ matrix.suite }} ${{ matrix.shard }} (macOS)
    needs: registry
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.registry.outputs.macos_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact triggering head
        run: bash .github/scripts/workflow/bats-customer-delivery-macos-01-assert-exact-triggering-head.sh

      - name: Install pinned A2 dependencies
        run: bash .github/scripts/workflow/install-bats-brew.sh bats-core yq openssl@3

      - name: Create trusted absolute Python environment
        run: bash .github/scripts/workflow/bats-customer-delivery-macos-02-create-trusted-absolute-python-environment.sh
      - name: Verify trusted Python launcher runtime and dependencies
        run: bash tests/check-customer-delivery-python-runtime.sh "$RUNNER_TEMP/customer-delivery-venv/bin/python"

      - name: Run bounded exact shard
        timeout-minutes: 2
        env:
          DEVELOPER_DIR: /Library/Developer/CommandLineTools
          SUITE: ${{ matrix.suite }}
          SHARD: ${{ matrix.shard }}
        run: bash .github/scripts/workflow/bats-customer-delivery-macos-03-run-bounded-exact-shard.sh
      - name: Upload exact shard result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: customer-delivery-macos-${{ strategy.job-index }}
          path: ${{ runner.temp }}/customer-delivery-result/*.json
          if-no-files-found: error
          retention-days: 1

  customer-delivery-aggregate:
    name: customer delivery Linux result inventory (macOS conditional)
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [registry, customer-delivery-linux, customer-delivery-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact triggering head
        run: bash .github/scripts/workflow/bats-customer-delivery-aggregate-01-assert-exact-triggering-head.sh

      - name: Download Linux shard results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: customer-delivery-linux-*
          path: ${{ runner.temp }}/customer-delivery-results/linux
          merge-multiple: true

      - name: Download macOS shard results
        if: github.event_name == 'workflow_dispatch' && inputs.run_hosted_macos
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: customer-delivery-macos-*
          path: ${{ runner.temp }}/customer-delivery-results/macos
          merge-multiple: true

      - name: Verify exact generated result inventories
        env:
          RUN_HOSTED_MACOS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_hosted_macos }}
        run: bash .github/scripts/workflow/bats-customer-delivery-aggregate-02-verify-exact-generated-result-inventories.sh
