name: node-tests

# Runs every node:test suite in the repository on the organisation self-hosted
# Linux pool.
#
# DISCOVERY, NOT ENUMERATION (same rule as bats.yml): the job globs every
# tracked *.test.mjs / *.test.js / *.test.cjs file, so a suite added tomorrow
# runs the moment it lands. Finding zero files fails the job instead of
# passing an empty run.
#
# PLATFORM SCOPE: Linux only. The controller-continuation plugin is Linux-only
# by design and refuses every other platform with an exact error category; on
# this runner those Linux-behaviour tests must all run, so a skip fails the job.
# macOS/BSD coverage for the paired refusal fixtures is NOT_MEASURED (no macOS
# self-hosted runner; GitHub-hosted runners are forbidden in this repository).

on:
  push:
    branches: [main]
    # ARC-CI-07: path filter on a non-required workflow only. Required contexts
    # (bats shards, security jobs, version consistency) keep unfiltered triggers.
    paths:
      - '**/*.mjs'
      - '**/*.js'
      - '**/*.cjs'
      - '**/package.json'
      - '**/package-lock.json'
      - '**/pnpm-lock.yaml'
      - '.github/workflows/node-tests.yml'
  pull_request:
    paths:
      - '**/*.mjs'
      - '**/*.js'
      - '**/*.cjs'
      - '**/package.json'
      - '**/package-lock.json'
      - '**/pnpm-lock.yaml'
      - '.github/workflows/node-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-test:
    name: node --test (linux)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, X64, ci-general]
    timeout-minutes: 10
    steps:
      - name: Repair self-hosted workspace ownership
        run: |
          if command -v docker >/dev/null 2>&1; then
            docker run --rm \
              -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
              -v "$RUNNER_TEMP:$RUNNER_TEMP" \
              ubuntu:24.04 \
              chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" || true
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Same major as reusable-security-audit.yml. The suites use
          # node:module registerHooks, which needs Node >= 22.15.
          node-version: '24'
          # ARC-CI-09: Node tool cache only (no package manager install here).
          # Trust scope: Actions cache is branch/PR-scoped; forks cannot write
          # the default-branch cache used by privileged main runs.

      - name: Run every discovered node test suite
        env:
          IS_LINUX: ${{ runner.os == 'Linux' }}
        run: bash .github/scripts/workflow/node-tests-run.sh
