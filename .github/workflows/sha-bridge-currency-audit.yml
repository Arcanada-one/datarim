# INFRA-0202: weekly currency audit for the `preflight-check` SHA-bridge
# (preflight-mandate.md § clause 8, CI-Runners.md § 3.5).
#
# Probes whether ecosystem consumer files still pin the transitional
# `preflight-check@<baked-SHA>` bridge and, once tag v1 is published, runs
# the 7-day OP-3 decommission clock (warning on window-open, fatal once
# overdue, single info event + persisted state once fully removed).
#
# Deliberately NOT a runner-side systemd job on the development runner —
# Operational Resilience Mandate Principle 2 treats the laptop-class runner as
# unfit for production-critical drift detection. Mirrors
# security-stale-trigger.yml.
#
# Fail-soft: dev-tools/sha-bridge-audit.sh emits `::warning::`/`::error::`
# annotations and always exits 0 on its own network/API errors so this cron
# never pages on its own pipeline outages.
#
# Decommission state (decommissioned_at / window_opened_at) is Vault-backed
# per the script's primary path once `vault` + VAULT_ADDR/auth are wired up
# operator-side (not done here — real Vault auth provisioning is a
# hard-gated follow-up). Until then the script falls back to a local state
# file; this job commits that file back to the repo so the state survives
# across ephemeral runner invocations without needing Vault secrets.

name: sha-bridge-currency-audit

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sha-bridge-currency-audit
  cancel-in-progress: false

jobs:
  audit:
    name: probe SHA-bridge currency + decommission clock
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPS_BOT_API_KEY: ${{ secrets.OPSBOT_API_KEY }}
      VAULT_ADDR: ${{ vars.VAULT_ADDR }}
      SHA_BRIDGE_STATE_FILE: dev-tools/.state/sha-bridge-audit.state
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Run sha-bridge-audit.sh
        run: |
          mkdir -p dev-tools/.state
          bash dev-tools/sha-bridge-audit.sh

      - name: Persist state file through protected PR (fallback path only)
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_BRANCH: automation/infra-0202-sha-bridge-state
          BASE_BRANCH: main
        run: |
          if ! git status --porcelain -- dev-tools/.state/ | grep -q .; then
            echo 'No fallback state change to publish.'
            exit 0
          fi

          state_backup="$(mktemp -d)"
          trap 'rm -rf "$state_backup"' EXIT
          mkdir -p "$state_backup/state"
          cp -a dev-tools/.state/. "$state_backup/state/"
          rm -rf dev-tools/.state
          mkdir -p dev-tools/.state

          git fetch origin "$BASE_BRANCH"
          git fetch origin "$STATE_BRANCH" 2>/dev/null || true
          if git show-ref --verify --quiet "refs/remotes/origin/$STATE_BRANCH"; then
            git switch --create "$STATE_BRANCH" --track "origin/$STATE_BRANCH"
          else
            git switch --create "$STATE_BRANCH" "origin/$BASE_BRANCH"
          fi
          cp -a "$state_backup/state/." dev-tools/.state/

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A dev-tools/.state/
          git diff --cached --quiet && exit 0
          git commit -m 'chore(INFRA-0202): sha-bridge-audit state update [skip ci]'
          git push origin "HEAD:$STATE_BRANCH"

          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$STATE_BRANCH" \
            --base "$BASE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            echo "Updated protected state PR #$pr_number. Operator review/landing remains required."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$BASE_BRANCH" \
              --head "$STATE_BRANCH" \
              --title 'chore(INFRA-0202): persist SHA-bridge audit state' \
              --body 'This automation PR persists the SHA-bridge decommission clock state produced by the scheduled audit. It deliberately targets an automation branch because main is protected. Do not auto-merge; review the state-only diff and land through the ordinary protected path.'
          fi
