name: dr-orchestrate contract

on:
  push:
    paths:
      - 'plugins/dr-orchestrate/**'
      - '.github/workflows/dr-orchestrate-contract.yml'
  pull_request:
    paths:
      - 'plugins/dr-orchestrate/**'
      - '.github/workflows/dr-orchestrate-contract.yml'

permissions:
  contents: read

# ARC-CI-07: cancel superseded runs on the same ref (path-filtered workflow).
concurrency:
  group: dr-orchestrate-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schemathesis:
    name: Schemathesis contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python + schemathesis
        run: bash .github/scripts/workflow/dr-orchestrate-contract-schemathesis-01-install-python-schemathesis.sh

      - name: Install socat (dr-orchestrate-server.sh dependency)
        run: bash .github/scripts/workflow/dr-orchestrate-contract-schemathesis-02-install-socat-dr-orchestrate-server-sh-dependenc.sh

      - name: Start dr-orchestrate bash server on ephemeral port
        env:
          DR_ORCH_INBOUND_TOKEN: ${{ secrets.DR_ORCH_INBOUND_TOKEN || 'ci-test-token' }}
          DR_ORCH_DIR: ${{ github.workspace }}/plugins/dr-orchestrate
          DR_ORCH_PORT: 8090
          # Per-project state, explicitly. Datarim is project-local and there is
          # no $HOME fallback any more: a handler that enqueues into the inbox
          # refuses when no project runtime is in scope, and the server turns
          # that refusal into a 500. Naming the state directory here gives the
          # contract run the project context a real installation would have,
          # instead of putting the fallback back to make the test pass.
          DR_ORCH_STATE_DIR: /tmp/dr-orch-ci/state
        run: bash .github/scripts/workflow/dr-orchestrate-contract-schemathesis-03-start-dr-orchestrate-bash-server-on-ephemeral-po.sh

      - name: Run schemathesis
        env:
          DR_ORCH_INBOUND_TOKEN: ${{ secrets.DR_ORCH_INBOUND_TOKEN || 'ci-test-token' }}
        run: bash .github/scripts/workflow/dr-orchestrate-contract-schemathesis-05-run-schemathesis.sh

      - name: Teardown reference impl
        if: always()
        run: bash .github/scripts/workflow/dr-orchestrate-contract-schemathesis-04-teardown-reference-impl.sh
