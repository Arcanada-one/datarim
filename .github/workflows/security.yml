name: security

# Datarim full security gate (TUNE-0045 P2).
# 15 parallel jobs covering shell + python + supply chain + secrets + workflows.
# Replaces the P1 stop-gap security-minimal.yml.
#
# Tools install pattern:
#   - Trivial OS packages (shellcheck, bats) → apt-get on the runner image.
#   - Python tooling (bandit, semgrep, zizmor) → pipx (PyPI integrity = TLS + index attestation).
#   - Standalone binaries (gitleaks, trufflehog, actionlint, osv-scanner) → download release tarball,
#     verify the matching SHA256 from the project's release checksums file, install to /usr/local/bin.
#   - Single third-party action — actions/checkout — pinned to commit SHA.
#
# This avoids managing pin-rot across 6+ third-party actions while keeping the
# install layer transparent and auditable.

on:
  pull_request:
  push:
    branches: [main, "tune-*"]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. shellcheck on shell sources
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: bash .github/scripts/workflow/security-shellcheck-01-install-shellcheck.sh
      - name: Run shellcheck (severity=warning)
        run: bash .github/scripts/workflow/security-shellcheck-02-run-shellcheck-severity-warning.sh
  # 2. shellcheck on bash blocks extracted from markdown
  shellcheck-extracted:
    name: shellcheck-extracted
    runs-on: ubuntu-latest
    # Informational during the TUNE-0045 baseline window: many shipped skills
    # contain illustrative bash snippets with `<PLACEHOLDER>` syntax that fails
    # shellcheck. Promotion to required pending TUNE-0048 (tag illustrative
    # blocks with `# nosec-extract` or `<!-- security:counter-example -->`).
    # See documentation/archive/security/triage-2026-04.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: bash .github/scripts/workflow/security-shellcheck-extracted-01-install-shellcheck.sh
      - name: Extract bash blocks from markdown
        run: bash .github/scripts/workflow/security-shellcheck-extracted-02-extract-bash-blocks-from-markdown.sh
      - name: Run shellcheck on extracted bash blocks
        run: bash .github/scripts/workflow/security-shellcheck-extracted-03-run-shellcheck-on-extracted-bash-blocks.sh
  # 3. bandit on python sources
  bandit:
    name: bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install bandit
        run: bash .github/scripts/workflow/security-bandit-01-install-bandit.sh
      - name: Verify Bandit unsafe and clean controls
        run: bash .github/scripts/workflow/security-bandit-02-verify-bandit-unsafe-and-clean-controls.sh
      - name: Run bandit on .py files
        run: bash .github/scripts/workflow/security-bandit-03-run-bandit-on-py-files.sh
  # 4. bandit on python blocks extracted from markdown
  bandit-extracted:
    name: bandit-extracted
    runs-on: ubuntu-latest
    # Informational during the TUNE-0045 baseline window — same rationale as
    # shellcheck-extracted (illustrative blocks need explicit opt-out tagging).
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install bandit
        run: bash .github/scripts/workflow/security-bandit-extracted-01-install-bandit.sh
      - name: Extract python blocks from markdown
        run: bash .github/scripts/workflow/security-bandit-extracted-02-extract-python-blocks-from-markdown.sh
      - name: Run bandit on extracted python blocks
        run: bash .github/scripts/workflow/security-bandit-extracted-03-run-bandit-on-extracted-python-blocks.sh
  # 5. Semgrep with repository-owned rules and SARIF upload
  semgrep-sarif:
    name: semgrep-sarif
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install semgrep
        run: bash .github/scripts/workflow/security-semgrep-sarif-01-install-semgrep.sh
      - name: Run semgrep
        run: bash .github/scripts/workflow/security-semgrep-sarif-02-run-semgrep.sh
      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          sarif_file: semgrep.sarif
          category: semgrep-python-security-v1

  # 6. CodeQL for the shipped Python implementation surface
  codeql-python:
    name: codeql-python
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: python
      - name: Analyze Python
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: codeql-python-v1

  # 7. gitleaks — full git history secret scan (sha256-pinned binary)
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (pinned binary)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: bash .github/scripts/workflow/security-gitleaks-01-install-gitleaks-pinned-binary.sh
      - name: Scan working tree + full history
        run: bash .github/scripts/workflow/security-gitleaks-02-scan-working-tree-full-history.sh
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-sarif
          path: /tmp/gitleaks.sarif
          if-no-files-found: ignore

  # 8. trufflehog — verified secrets only (binary verified via release checksums)
  trufflehog:
    name: trufflehog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install trufflehog (release checksums verified)
        env:
          TRUFFLEHOG_VERSION: 3.83.7
        run: bash .github/scripts/workflow/security-trufflehog-01-install-trufflehog-release-checksums-verified.sh
      - name: Run trufflehog filesystem (verified only)
        run: bash .github/scripts/workflow/security-trufflehog-02-run-trufflehog-filesystem-verified-only.sh

  # 9. actionlint — workflow-yaml lint (binary verified via release checksums)
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (release checksums verified)
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: bash .github/scripts/workflow/security-actionlint-01-install-actionlint-release-checksums-verified.sh
      - name: Run actionlint
        # `ci-general` is the org's self-hosted CI lane label (bats.yml). It is declared here rather than in
        # .github/actionlint.yaml because that file is a retired surface (tests/security/scorecard-contract.bats).
        # The pattern names this one label, so any other unknown label is still an error.
        run: bash .github/scripts/workflow/security-actionlint-02-run-actionlint.sh

  # 10. zizmor — GitHub Actions security audit
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install zizmor
        run: bash .github/scripts/workflow/security-zizmor-01-install-zizmor.sh
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/workflow/security-zizmor-02-run-zizmor.sh

  # 11. osv-scanner — dependency vulnerabilities (binary verified via release checksums)
  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install osv-scanner (release checksums verified)
        env:
          OSV_VERSION: 2.3.5
        run: bash .github/scripts/workflow/security-osv-scanner-01-install-osv-scanner-release-checksums-verified.sh
      - name: Run osv-scanner
        run: bash .github/scripts/workflow/security-osv-scanner-02-run-osv-scanner.sh
  # 12. bats regression tests for fixed findings
  regression-bats:
    name: regression-bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bats
        run: bash .github/scripts/workflow/security-regression-bats-01-install-bats.sh
      - name: Run security regression tests
        run: bash tests/security/run-all.sh

  # 13. markdown-policy — anti-pattern grep over shipped docs (counter-example fence aware)
  markdown-policy:
    name: markdown-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Anti-pattern scan (skipping counter-example fences)
        run: bash .github/scripts/workflow/security-markdown-policy-01-anti-pattern-scan-skipping-counter-example-fence.sh
  # 14. doc-refs — markdown reference integrity linter (TUNE-0054)
  doc-refs:
    name: doc-refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bats
        run: bash .github/scripts/workflow/security-doc-refs-01-install-bats.sh
      - name: Run check-doc-refs bats fixtures
        run: bats tests/check-doc-refs.bats
      - name: Self-dogfood — run linter against repo HEAD with baseline applied
        run: bash scripts/check-doc-refs.sh --root .

  # 15. task-id-gate — history-agnostic policy on governed public surfaces
  task-id-gate:
    name: task-id-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bats
        run: bash .github/scripts/workflow/security-task-id-gate-01-install-bats.sh
      - name: Run task-id-gate bats fixtures
        run: bats tests/task-id-gate.bats
      - name: Self-dogfood — gate against governed scopes (full tree)
        run: bash .github/scripts/workflow/security-task-id-gate-02-self-dogfood-gate-against-governed-scopes-full-t.sh
