# Reusable workflow — Arcanada Ecosystem security-audit gate.
# Canonical contract: consumer ecosystem AGENTS.md
# § Arcanada Ecosystem Security Policy Mandate.
#
# Drop into consumer .github/workflows/ci.yml:
#
#   jobs:
#     security-audit:
#       uses: Arcanada-one/datarim/.github/workflows/reusable-security-audit.yml@main
#       with:
#         stack: typescript_pnpm        # one of: typescript_pnpm | rust_cargo | python | framework
#         audit_level: high             # high (default) | moderate | critical
#         accepted_risk_path: accepted-risk.yml
#
name: reusable-security-audit

on:
  workflow_call:
    inputs:
      stack:
        description: 'Stack profile: typescript_pnpm | rust_cargo | python | framework'
        type: string
        required: true
      audit_level:
        description: 'Audit severity floor: high (default) | moderate | critical'
        type: string
        required: false
        default: 'high'
      accepted_risk_path:
        description: 'Path to accepted-risk.yml within consumer repo'
        type: string
        required: false
        default: 'accepted-risk.yml'
      datarim_ref:
        description: 'Datarim ref to checkout the gate scripts from'
        type: string
        required: false
        default: 'main'
      runner_labels:
        description: 'JSON array string of runner labels to pin the job (workflow_call inputs cannot be arrays; consumed via fromJSON in runs-on)'
        type: string
        required: false
        # A bare [self-hosted, linux] default matches every Linux runner the caller may use, including a
        # restricted-group runner the caller is allowlisted for (e.g. a deploy or database host). The default
        # names the general CI lane instead, the same lane as network-exposure-lint's default.
        default: '["self-hosted","linux","ci-general"]'

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: security-audit (${{ inputs.stack }})
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain (rust_cargo profile only)
        if: inputs.stack == 'rust_cargo'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Setup Node toolchain (typescript_pnpm profile only)
        if: inputs.stack == 'typescript_pnpm'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24, not 20. Corepack resolves the current pnpm (11.x), which
          # requires the `node:sqlite` builtin; on Node 20 it dies with
          # ERR_UNKNOWN_BUILTIN_MODULE. Found empirically on a web-serving self-hosted runner
          # — setup-node itself succeeded and the pnpm shim then crashed.
          node-version: '24'

      - name: Clone Datarim gates and run security audit
        env:
          DATARIM_REF: ${{ inputs.datarim_ref }}
          STACK: ${{ inputs.stack }}
          AUDIT_LEVEL: ${{ inputs.audit_level }}
          ACCEPTED_RISK_PATH: ${{ inputs.accepted_risk_path }}
        run: bash .github/scripts/workflow/reusable-security-audit-job.sh
