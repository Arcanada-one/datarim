name: TALO-0001 trusted replay

'on':
  workflow_run: # zizmor: ignore[dangerous-triggers] -- exact event tuple is job-gated before runner I/O; trusted main controller never executes candidate code
    workflows: ['dev-tools-lint']
    types: [completed]

permissions: {}

jobs:
  initialize:
    name: talo-0001-current-verdict-initializer
    if: >-
      github.event.workflow_run.workflow_id == 270931528 &&
      github.event.workflow_run.name == 'dev-tools-lint' &&
      github.event.workflow_run.path == '.github/workflows/dev-tools-lint.yml' &&
      github.event.workflow_run.repository.full_name == 'Arcanada-one/datarim' &&
      github.event.workflow_run.head_repository.full_name == 'Arcanada-one/datarim' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].head.sha == github.event.workflow_run.head_sha &&
      github.event.workflow_run.pull_requests[0].number == 394 &&
      github.event.workflow_run.pull_requests[0].head.ref == 'research/TALO-0001-frontend-design' &&
      github.event.workflow_run.pull_requests[0].head.repo.url == 'https://api.github.com/repos/Arcanada-one/datarim' &&
      github.event.workflow_run.pull_requests[0].base.ref == 'main' &&
      github.event.workflow_run.pull_requests[0].base.repo.url == 'https://api.github.com/repos/Arcanada-one/datarim' &&
      github.event.workflow_run.pull_requests[1] == null
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    timeout-minutes: 2
    outputs:
      check_id: ${{ steps.initialize-verdict.outputs.check_id }}
      execution_nonce: ${{ steps.initialize-verdict.outputs.execution_nonce }}
      current_base: ${{ steps.initialize-verdict.outputs.current_base }}
      head_sha: ${{ steps.initialize-verdict.outputs.head_sha }}
      base_sha: ${{ steps.initialize-verdict.outputs.base_sha }}
      trusted_run_id: ${{ steps.initialize-verdict.outputs.trusted_run_id }}
      trusted_run_attempt: ${{ steps.initialize-verdict.outputs.trusted_run_attempt }}
      workflow_sha: ${{ steps.initialize-verdict.outputs.workflow_sha }}
      source_run_id: ${{ steps.initialize-verdict.outputs.source_run_id }}
      source_run_attempt: ${{ steps.initialize-verdict.outputs.source_run_attempt }}
    steps:
      - name: Initialize checkout-independent current-run verdict
        id: initialize-verdict
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          TRUSTED_RUN_ID: ${{ github.run_id }}
          TRUSTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVENT_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUSTED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$TRUSTED_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          live_main_response=''
          trusted_workflow_sha=''
          if live_main_response=$(gh api repos/Arcanada-one/datarim/git/ref/heads/main); then
            trusted_workflow_sha=$(jq -er '
              select(type == "object" and (keys | sort) == ["node_id","object","ref","url"])
              | select(.ref == "refs/heads/main")
              | select(.node_id | type == "string" and length > 0)
              | select(.url == "https://api.github.com/repos/Arcanada-one/datarim/git/refs/heads/main")
              | .object
              | select(type == "object" and (keys | sort) == ["sha","type","url"])
              | select(.type == "commit")
              | select(.url == ("https://api.github.com/repos/Arcanada-one/datarim/git/commits/" + .sha))
              | .sha
              | select(type == "string" and test("^[0-9a-f]{40}$"))
            ' <<<"$live_main_response" 2>/dev/null || true)
          fi
          live_main_available=true
          if [[ ! "$trusted_workflow_sha" =~ ^[0-9a-f]{40}$ ]]; then
            live_main_available=false
            trusted_workflow_sha=$EVENT_WORKFLOW_SHA
          fi
          expected_nonce=$(
            printf 'trusted_run_id=%s\ntrusted_run_attempt=%s\nworkflow_sha=%s\nsource_run_id=%s\nsource_run_attempt=%s\nhead_sha=%s\nbase_sha=%s\n' \
              "$TRUSTED_RUN_ID" "$TRUSTED_RUN_ATTEMPT" "$trusted_workflow_sha" \
              "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" "$HEAD_SHA" "$BASE_SHA" \
              | sha256sum | cut -d' ' -f1
          )
          if [ "$live_main_available" != true ] \
            || [ "$EVENT_WORKFLOW_SHA" != "$trusted_workflow_sha" ] \
            || [ "$BASE_SHA" != "$trusted_workflow_sha" ]; then
            response=$(gh api --method POST repos/Arcanada-one/datarim/check-runs \
              -f name=talo-0001-privileged-replay -f head_sha="$HEAD_SHA" \
              -f status=completed -f conclusion=failure \
              -f external_id="$expected_nonce" \
              -f 'output[title]=TALO-0001 trusted replay' \
              -f 'output[summary]=Controller or source base is not verified against live main.')
            jq -e --arg head "$HEAD_SHA" --arg nonce "$expected_nonce" \
              'select(.name == "talo-0001-privileged-replay" and .head_sha == $head and .external_id == $nonce and .status == "completed" and .conclusion == "failure") | .id | select(type == "number" and . > 0 and floor == .)' \
              <<<"$response" >/dev/null
            check_id=$(jq -er '.id | select(type == "number" and . > 0 and floor == .)' \
              <<<"$response")
            printf 'check_id=%s\nexecution_nonce=%s\ncurrent_base=false\n' \
              "$check_id" "$expected_nonce" >>"$GITHUB_OUTPUT"
            exit 1
          fi
          response=$(gh api --method POST repos/Arcanada-one/datarim/check-runs \
            -f name=talo-0001-privileged-replay -f head_sha="$HEAD_SHA" \
            -f status=in_progress -f external_id="$expected_nonce" \
            -f 'output[title]=TALO-0001 trusted replay' \
            -f 'output[summary]=Current trusted replay is pending.')
          check_id=$(jq -er --arg head "$HEAD_SHA" --arg nonce "$expected_nonce" \
            'select(.name == "talo-0001-privileged-replay" and .head_sha == $head and .external_id == $nonce and .status == "in_progress") | .id | select(type == "number" and . > 0 and floor == .)' \
            <<<"$response")
          {
            printf 'check_id=%s\nexecution_nonce=%s\ncurrent_base=true\n' \
              "$check_id" "$expected_nonce"
            printf 'head_sha=%s\nbase_sha=%s\ntrusted_run_id=%s\ntrusted_run_attempt=%s\n' \
              "$HEAD_SHA" "$BASE_SHA" "$TRUSTED_RUN_ID" \
              "$TRUSTED_RUN_ATTEMPT"
            printf 'workflow_sha=%s\nsource_run_id=%s\nsource_run_attempt=%s\n' \
              "$trusted_workflow_sha" "$SOURCE_RUN_ID" \
              "$SOURCE_RUN_ATTEMPT"
          } >>"$GITHUB_OUTPUT"
  replay:
    name: talo-0001-trusted-replay-controller
    needs: [initialize]
    if: >-
      needs.initialize.result == 'success' &&
      needs.initialize.outputs.current_base == 'true' &&
      needs.initialize.outputs.base_sha == needs.initialize.outputs.workflow_sha
    runs-on:
      group: talo-0001-trusted
      labels: [self-hosted, Linux, X64, talo-0001-trusted]
    permissions:
      contents: read
      checks: write
    timeout-minutes: 8
    steps:
      - name: Check out trusted default-main controller
        id: trusted-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.initialize.outputs.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Validate workflow-run identity before secret materialization
        env:
          TALO_TRUSTED_WORKFLOW_SHA: ${{ needs.initialize.outputs.workflow_sha }}
        run: trusted/dev-tools/preflight-talo-0001-workflow-run.sh "$GITHUB_EVENT_PATH"
      - name: Run trusted collection and sandboxed exact-head replay
        env:
          GH_TOKEN: ${{ github.token }}
          TALO_TRUSTED_RUN_ID: ${{ needs.initialize.outputs.trusted_run_id }}
          TALO_TRUSTED_RUN_ATTEMPT: ${{ needs.initialize.outputs.trusted_run_attempt }}
          TALO_TRUSTED_WORKFLOW_SHA: ${{ needs.initialize.outputs.workflow_sha }}
          TALO_SOURCE_RUN_ID: ${{ needs.initialize.outputs.source_run_id }}
          TALO_SOURCE_RUN_ATTEMPT: ${{ needs.initialize.outputs.source_run_attempt }}
          TALO_BASE_SHA: ${{ needs.initialize.outputs.base_sha }}
          TALO_EXECUTION_NONCE: ${{ needs.initialize.outputs.execution_nonce }}
        run: |
          trusted/dev-tools/trusted-talo-0001-replay.sh \
            --event "$GITHUB_EVENT_PATH" \
            --candidate "$RUNNER_TEMP/candidate" \
            --output "$RUNNER_TEMP/talo-0001-attestation.json"
      - name: Publish fixed candidate-head verdict
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.initialize.outputs.head_sha }}
          BASE_SHA: ${{ needs.initialize.outputs.base_sha }}
          TRUSTED_RUN_ID: ${{ needs.initialize.outputs.trusted_run_id }}
          TRUSTED_RUN_ATTEMPT: ${{ needs.initialize.outputs.trusted_run_attempt }}
          TRUSTED_WORKFLOW_SHA: ${{ needs.initialize.outputs.workflow_sha }}
          SOURCE_RUN_ID: ${{ needs.initialize.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ needs.initialize.outputs.source_run_attempt }}
          CHECK_RUN_ID: ${{ needs.initialize.outputs.check_id }}
          EXPECTED_EXECUTION_NONCE: ${{ needs.initialize.outputs.execution_nonce }}
          TRUSTED_CHECKOUT_OUTCOME: ${{ steps.trusted-checkout.outcome }}
          ATTESTATION: ${{ runner.temp }}/talo-0001-attestation.json
        run: |
          set -euo pipefail
          publisher=trusted/dev-tools/publish-talo-0001-check.sh
          if [ "$TRUSTED_CHECKOUT_OUTCOME" = success ] \
            && [ -f "$publisher" ] && [ ! -L "$publisher" ]; then
            exec "$publisher"
          fi
          expected_nonce=$(
            printf 'trusted_run_id=%s\ntrusted_run_attempt=%s\nworkflow_sha=%s\nsource_run_id=%s\nsource_run_attempt=%s\nhead_sha=%s\nbase_sha=%s\n' \
              "$TRUSTED_RUN_ID" "$TRUSTED_RUN_ATTEMPT" "$TRUSTED_WORKFLOW_SHA" \
              "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" "$HEAD_SHA" "$BASE_SHA" \
              | sha256sum | cut -d' ' -f1
          )
          [ "$expected_nonce" = "$EXPECTED_EXECUTION_NONCE" ]
          [[ "$CHECK_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          response=$(gh api "repos/Arcanada-one/datarim/check-runs/$CHECK_RUN_ID")
          jq -e --argjson id "$CHECK_RUN_ID" --arg head "$HEAD_SHA" \
            --arg nonce "$expected_nonce" \
            'select(.id == $id and .name == "talo-0001-privileged-replay" and .head_sha == $head and .external_id == $nonce and .status == "in_progress")' \
            <<<"$response" >/dev/null
          gh api --method PATCH \
            "repos/Arcanada-one/datarim/check-runs/$CHECK_RUN_ID" \
            -f status=completed -f conclusion=failure \
            -f 'output[title]=TALO-0001 trusted replay' \
            -f 'output[summary]=Trusted controller checkout failed.' >/dev/null
          exit 1
