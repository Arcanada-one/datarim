# Dependabot configuration.
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Scope: keep GitHub Actions pinned to verified SHAs, and track the pinned CI
# test dependencies in tests/ci-requirements/. The framework ships no runtime
# package manifests. A pip bump there MUST also update the matching pins in
# .github/scripts/workflow/framework-gates-*-01-install-*.sh (the files CI
# actually installs from); otherwise the PR tests the old version. All pip bumps
# are grouped into one PR and capped at 2 open PRs.

version: 2

updates:
  # GitHub Actions used in workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    # Delay PRs for freshly-released versions so a compromised release has time
    # to be discovered and yanked before it reaches CI (supply-chain hardening).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Pinned CI test dependencies (cache-key files for framework-gates jobs).
  - package-ecosystem: "pip"
    directory: "/tests/ci-requirements"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      ci-test-deps:
        applies-to: version-updates
        patterns:
          - "*"
